name: Feedback or idea
description: What you liked, what you would change, a song you would like to hear
labels: [feedback]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: How did you visit?
      options:
        - Meta Quest (in VR)
        - Phone or tablet
        - Computer
        - Something else
